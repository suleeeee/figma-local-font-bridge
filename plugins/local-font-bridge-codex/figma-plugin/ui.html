<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;padding:20px;font:12px/1.6 system-ui,sans-serif;background:var(--figma-color-bg,#fff);color:var(--figma-color-text,#222)}h1{font-size:18px;margin:0 0 6px}h2{font-size:13px;margin:18px 0 8px}p{margin:6px 0 12px;color:var(--figma-color-text-secondary,#666)}label{display:block;margin:8px 0 4px}input,textarea,select{width:100%;padding:8px;border:1px solid var(--figma-color-border,#ccc);border-radius:6px;background:var(--figma-color-bg,#fff);color:inherit;font:inherit}button{padding:8px 12px;border:0;border-radius:6px;background:var(--figma-color-bg-brand,#087fea);color:var(--figma-color-text-onbrand,#fff);cursor:pointer}button.secondary{background:var(--figma-color-bg-secondary,#eee);color:inherit}button:disabled{opacity:.5;cursor:default}.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}.status{padding:10px;border-radius:6px;background:var(--figma-color-bg-secondary,#eee);margin:14px 0;overflow-wrap:anywhere}pre{white-space:pre-wrap;word-break:break-word;max-height:170px;overflow:auto;padding:10px;background:var(--figma-color-bg-secondary,#eee);border-radius:6px}textarea{height:130px;font:11px/1.5 monospace}#approval{border:1px solid var(--figma-color-border,#ccc);padding:12px;border-radius:8px;margin:14px 0}small{color:var(--figma-color-text-secondary,#666)}[hidden]{display:none!important}
.setup-step{margin:0 0 6px}.install-instruction{display:block;height:48px;resize:none;margin:0 0 10px;padding:6px 8px;font:11px/1.5 system-ui,sans-serif;overflow-wrap:anywhere;color:var(--figma-color-text-secondary,#666)}
.version{position:fixed;right:12px;bottom:8px;font-size:10px;line-height:1;color:var(--figma-color-text-tertiary,#999);opacity:.65;pointer-events:none}
</style></head><body>
<p class="setup-step">① 将下方指令发给本地 AI，安装 Skill。</p>
<textarea class="install-instruction" readonly aria-label="复制给 AI 的 Skill 安装指令" onclick="this.select()">安装这个 Skill：https://github.com/suleeeee/figma-local-font-bridge/tree/main/skills/figma-local-font-bridge</textarea>
<p class="setup-step">② 新建 AI 聊天，保持插件打开。</p>
<div class="status" id="status" role="status" aria-live="polite">等待 AI 工具连接…（保持插件打开）</div>


<span class="version">v1.0.0</span>
<script>
const $ = id => document.getElementById(id);
const base = 'http://localhost:4789';
const session = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
let settingsTimer, settingsAttempts=0;
let connected = false, generation = 0, timer, failures = 0, pluginKey = "", authorized = false;
const seen = new Set(), outbox = new Map();
let executing = null;
function send(message) { parent.postMessage({pluginMessage:message}, '*'); }
function setStatus(text) { $('status').textContent = text; }
async function request(route, body, token) {
 const controller = new AbortController(); const timeout = setTimeout(() => controller.abort(), 4500);
 try { const res = await fetch(base + route, {method:body === undefined ? 'GET':'POST',headers:{'content-type':'application/json',authorization:`Bearer ${token}`},body:body === undefined ? undefined:JSON.stringify(body),signal:controller.signal});
 const data = await res.json(); if (!res.ok) { const error = new Error(data.error || `HTTP ${res.status}`); error.status = res.status; throw error; } return data;
 } finally {clearTimeout(timeout);}
}
function stop() { connected=false;generation++;clearTimeout(timer);executing=null; }
function connect() {stop(); if (!pluginKey) return; connected=true;failures=0;setStatus('等待 AI 工具连接…（保持插件打开）');poll(generation);}
async function poll(g) {
 const token=pluginKey;
 try {
  if (!authorized) {
   const registration = await request('/plugin/register', {key:pluginKey}, ''); if(g!==generation)return;
   if (!registration.approved) {setStatus('等待连接授权：授权后自动执行 AI 任务。');failures=0;return;}
   authorized=true;
  }
  await request('/health', undefined, token); if(g!==generation)return;
  for (const [id,payload] of outbox) { try {await request('/plugin/result',payload,token);outbox.delete(id);}catch(e){if(e.status===409)outbox.delete(id);else throw e;} }
  if(g!==generation)return;
  const {task}=await request('/plugin/next',{session},token);if(g!==generation)return;
  failures=0;
  if(executing && (!task || task.id!==executing))executing=null;
  if(task && !seen.has(task.id)) {
   seen.add(task.id); if(seen.size>500)seen.delete(seen.values().next().value);
   if(Date.now()>=task.deadline){outbox.set(task.id,{id:task.id,session,ok:false,error:'任务已过期，未执行'});}
   else {executing=task.id;send({type:'execute',task,approved:task.kind==='run-js'});setStatus(task.kind==='run-js'?'已连接：正在自动执行…':'已连接：正在查询字体…');}
  } else setStatus(executing?'已连接：正在执行…':'已连接，等待本机任务。');
 } catch(error) {
  if(g!==generation)return;
  failures++;
  if(error.status===401) {authorized=false;setStatus('正在重新连接 AI 工具…');return;}
  if(error.status===409) {failures=0;setStatus('正在等待旧连接释放，自动重连中…（保持插件打开）');return;}
  setStatus('等待 AI 工具连接…（保持插件打开）');
 } finally {if(connected&&g===generation)timer=setTimeout(()=>poll(g),Math.min(10000,900*Math.pow(2,Math.min(failures,4))));}
}
window.onmessage=event=>{const message=event.data && event.data.pluginMessage;if(!message || typeof message!=='object')return;
 if(event.source!==parent && message.bridgeSession!==session)return;
 if(message.type==='settings'){
  if(pluginKey)return;clearTimeout(settingsTimer);
  try {
   if(!message.token && (typeof crypto==='undefined' || typeof crypto.getRandomValues!=='function'))throw new Error('当前界面无法生成安全连接凭据，请检查插件控制台。');
   pluginKey=message.token || Array.from(crypto.getRandomValues(new Uint8Array(24)),b=>b.toString(16).padStart(2,'0')).join('');
   send({type:'save-settings',token:pluginKey});connect();
  } catch(error){setStatus('初始化失败：'+error.message);}
 }
 if(message.type==='settings-error'){clearTimeout(settingsTimer);setStatus('初始化失败：'+message.error);}
 if(message.type==='result'){if(executing===message.id)executing=null;outbox.set(message.id,{...message,session});setStatus(message.ok?'任务完成，等待结果回传。':'任务失败，等待结果回传。');}
};
function requestSettings(){
 if(pluginKey)return;
 send({type:'get-settings',bridgeSession:session});
 settingsAttempts++;
 if(settingsAttempts>=5){setStatus('插件初始化未响应，请关闭后重新打开，并确认 code.js 与 ui.html 已一同更新。');return;}
 settingsTimer=setTimeout(requestSettings,1000);
}
window.onerror=(message)=>{setStatus('界面错误：'+String(message).slice(0,180));};
requestSettings();
</script></body></html>
